- generic [active] [ref=f4e1]: "{\"name\":\"fictional-bassoon-chat-agent\",\"description\":\"Chat agent backed by a LangGraph Deep Agent with a single Tavily web-search tool. Exposes the existing Celery/Redis streaming chat pipeline over the A2A protocol.\",\"supportedInterfaces\":[{\"url\":\"http://localhost:8000/a2a\",\"protocolBinding\":\"JSONRPC\",\"protocolVersion\":\"1.0\"}],\"version\":\"0.1.0\",\"capabilities\":{\"streaming\":true,\"pushNotifications\":false,\"extendedAgentCard\":false},\"defaultInputModes\":[\"text/plain\"],\"defaultOutputModes\":[\"text/plain\"],\"skills\":[{\"id\":\"chat\",\"name\":\"Conversational chat\",\"description\":\"Holds a multi-turn conversation, using LangGraph checkpointing keyed by the A2A contextId (mapped 1:1 onto this backend's existing thread_id) to keep context across turns.\",\"tags\":[\"chat\",\"conversation\"],\"examples\":[\"Summarize the last thing I asked you about.\"],\"inputModes\":[\"text/plain\"],\"outputModes\":[\"text/plain\"]},{\"id\":\"web_search\",\"name\":\"Web search (Tavily)\",\"description\":\"When a question needs current information, the agent autonomously calls its one configured tool, Tavily web search (max 5 results), and answers using the results.\",\"tags\":[\"search\",\"web\",\"tavily\"],\"examples\":[\"What's the latest release version of FastAPI?\"],\"inputModes\":[\"text/plain\"],\"outputModes\":[\"text/plain\"]}]}"